name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_run:
    workflows: [Update flake.lock]
    types: [completed]

permissions:
  contents: read

# Supersede in-flight runs for the same PR; never cancel a push to the default
# branch.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    if: ${{ github.event_name != 'workflow_run' }}
    name: nix flake check (ubuntu x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # persist-credentials: false — this job runs untrusted PR code via
      # `nix flake check`, and never needs the token, so don't leave it in
      # .git/config for that code to read.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/nix-setup
        with:
          cachix-cache: ${{ vars.CACHIX_CACHE }}
          cachix-auth-token: ${{ github.event_name == 'push' && secrets.CACHIX_AUTH_TOKEN || '' }}

      # Runs the SBCL test suite (checks.default), the treefmt formatting gate
      # (checks.formatting), the coverage gate (checks.coverage), and the
      # mkdocs --strict build (checks.docs). The coverage check has its own
      # 300-second timeout in flake.nix and the job has a 25-minute ceiling.
      #
      # CI intentionally verifies the single supported system: x86_64-linux.
      - name: Check flake
        run: nix flake check --print-build-logs

      # Catches stray conflict markers and whitespace errors that compile fine.
      - name: Check diff hygiene
        run: git diff --check

  dispatch-flake-update-ci:
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' }}
    name: Dispatch CI for flake-update PR
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
      pull-requests: read
    steps:
      - name: Dispatch CI for bot-authored update PRs
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$REPOSITORY/pulls?state=open&per_page=100" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and .head.repo.full_name == env.REPOSITORY) | .head.ref' \
            | while IFS= read -r ref; do
                [ -n "$ref" ] || continue
                gh workflow run ci.yml --ref "$ref"
              done
