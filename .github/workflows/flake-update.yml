name: Update flake.lock

on:
  schedule:
    - cron: "0 4 * * 1" # 04:00 UTC every Monday
  workflow_dispatch:

permissions:
  contents: write # Push the update branch.
  pull-requests: write # Open the update PR.

# Serialize a manual dispatch that overlaps the weekly schedule, so the two
# runs cannot open competing update PRs.
concurrency:
  group: flake-update
  cancel-in-progress: false

jobs:
  update:
    name: Update flake inputs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Reuse the shared installer wiring (Cachix self-skips with no cache set),
      # keeping the nix-installer SHA pin in exactly one place.
      - uses: ./.github/actions/nix-setup

      # Opens or refreshes a pull request with updated flake inputs.
      #
      # NOTE: this uses the default GITHUB_TOKEN, so GitHub will not trigger CI
      # on the bot's PR directly (loop-prevention). ci.yml listens for this
      # workflow's completion and dispatches a CI run for each open
      # bot-authored update PR.
      - name: Update flake.lock
        uses: DeterminateSystems/update-flake-lock@da03c0f078bc4b2c37ee4f7e072d34bf8f188bb3 # v29
        with:
          pr-title: "chore: update flake.lock"
          commit-msg: "chore: update flake.lock"
